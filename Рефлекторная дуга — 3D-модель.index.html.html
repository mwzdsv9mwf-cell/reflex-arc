<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Рефлекторная дуга — 3D-модель</title>
<style>
:root{--bg:#fff;--fg:#1f1e1d;--fg2:#5f5e5a;--bd:#d3d1c7;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--fg:#f1efe8;--fg2:#b4b2a9;--bd:#444441}}
:root[data-theme="dark"]{--bg:#1f1e1d;--fg:#f1efe8;--fg2:#b4b2a9;--bd:#444441}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:500;margin:0 0 8px}
canvas{width:100%;height:min(60vh,420px);display:block;touch-action:none;cursor:grab}
#cap{font-size:15px;min-height:48px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 12px}
.lg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--fg2)}.lg i{width:10px;height:10px;border-radius:50%;flex:none}
</style></head><body><main>
<h1>Рефлекторная дуга: 3D-модель</h1>
<canvas id="c"></canvas>
<div id="cap">Потяните модель, чтобы повернуть. Нажмите «Запустить импульс».</div>
<div class="row"><button id="bp">Запустить импульс</button><button id="br">Вращение: вкл</button><button id="bz">Сброс</button></div>
<div class="g">
<div class="lg"><i style="background:#1D9E75"></i>1 Рецептор</div>
<div class="lg"><i style="background:#378ADD"></i>2 Чувствительный нейрон</div>
<div class="lg"><i style="background:#7F77DD"></i>3 Вставочный нейрон</div>
<div class="lg"><i style="background:#D85A30"></i>4 Двигательный нейрон</div>
<div class="lg"><i style="background:#E24B4A"></i>5 Эффектор (мышца)</div>
<div class="lg"><i style="background:#888780"></i>Серое вещество</div>
</div>
</main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
let W=380,H=330,S=0.9;
function rs(){W=cv.clientWidth;H=cv.clientHeight;S=Math.min(W/420,H/330);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
rs();addEventListener('resize',rs);
let ry=-0.7,rx=0.3,auto=true,drag=false,lx=0,ly=0,playing=false,t0=0,stage=-1;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*0.01;rx=Math.max(-1.3,Math.min(1.3,rx+(e.clientY-ly)*0.01));lx=e.clientX;ly=e.clientY});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=false;cv.style.cursor='grab'}));
document.getElementById('bp').onclick=function(){playing=!playing;t0=performance.now();this.textContent=playing?'Остановить импульс':'Запустить импульс';if(!playing)setStage(0)};
document.getElementById('br').onclick=function(){auto=!auto;this.textContent='Вращение: '+(auto?'вкл':'выкл')};
document.getElementById('bz').onclick=()=>{ry=-0.7;rx=0.3};
const txt=['Потяните модель, чтобы повернуть. Нажмите «Запустить импульс».','1. Рецептор в коже воспринимает раздражение и возбуждается.','2. Чувствительный (афферентный) нейрон несёт импульс к спинному мозгу через задний корешок.','3. Вставочный нейрон в сером веществе передаёт сигнал на двигательный нейрон.','4. Двигательный (эфферентный) нейрон выводит сигнал через передний корешок.','5. Эффектор — мышца — сокращается: это ответная реакция.'];
function setStage(s){if(s!==stage){stage=s;document.getElementById('cap').textContent=txt[s]}}
function cr(p,n){const o=[];for(let i=0;i<p.length-1;i++){const a=p[Math.max(i-1,0)],b=p[i],c=p[i+1],d=p[Math.min(i+2,p.length-1)];for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t;o.push([0,1,2].map(k=>0.5*(2*b[k]+(-a[k]+c[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(-a[k]+3*b[k]-3*c[k]+d[k])*t3)))}}o.push(p[p.length-1]);return o}
const A=cr([[-155,100,55],[-120,110,40],[-80,100,25],[-45,70,10],[-20,38,0],[-12,22,0]],8);
const I=cr([[-12,22,0],[0,0,0],[14,-24,0]],8);
const E=cr([[14,-24,0],[24,-40,0],[40,-72,-6],[80,-100,-22],[130,-112,-38]],8);
const F=A.concat(I.slice(1),E.slice(1));
const nA=A.length-1,nI=I.length-1;
const cum=[0];for(let i=1;i<F.length;i++)cum.push(cum[i-1]+Math.hypot(F[i][0]-F[i-1][0],F[i][1]-F[i-1][1],F[i][2]-F[i-1][2]));
const L=cum[cum.length-1];
function pr(p){const c=Math.cos(ry),s=Math.sin(ry),c2=Math.cos(rx),s2=Math.sin(rx);const x1=p[0]*c+p[2]*s,z1=-p[0]*s+p[2]*c,y1=p[1]*c2-z1*s2,z2=p[1]*s2+z1*c2,k=700/(700-z2);return{x:W/2+x1*k*S,y:H/2+8-y1*k*S,z:z2,k}}
function ell(cx,cy,rx_,ry_,z,n){const o=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;o.push([cx+Math.cos(a)*rx_,cy+Math.sin(a)*ry_,z])}return o}
const GM=[[0,0,10,16],[0,0,26,9],[-20,30,8,22],[20,30,8,22],[-26,-26,17,13],[26,-26,17,13]];
const C={rec:'#1D9E75',aff:'#378ADD',int:'#7F77DD',eff:'#D85A30',mus:'#E24B4A',act:'#EF9F27',gray:'136,135,128'};
const BD=[[-155,128,55,C.rec,1],[-100,128,28,C.aff,2],[0,12,42,C.int,3],[62,-72,-8,C.eff,4],[160,-92,-42,C.mus,5]];
const dend=[[0,0,0,[[-12,12,6],[12,10,-6],[-10,-12,-8]],C.int],[24,-40,0,[[-14,-8,6],[10,-14,-8],[-12,12,-4]],C.eff]];
function frame(now){
ctx.clearRect(0,0,W,H);
if(auto&&!drag)ry+=0.006;
let u=-1,con=0,st=0;
if(playing){const p=((now-t0)%5000)/5000;u=Math.min(p/0.8,1);if(p>0.8)con=Math.sin(Math.PI*(p-0.8)/0.2);
if(p<0.05)st=1;else if(u<1){let d=u*L,i=0;while(i<F.length-2&&cum[i+1]<d)i++;st=i<nA?2:i<nA+nI?3:4}else st=5;setStage(st)}
const d=u*L,it=[];
const push=(t,o)=>{o.t=t;it.push(o)};
const ring=(pts,fill,stroke,lw)=>{const q=pts.map(pr);push('p',{q,fill,stroke,lw,z:q.reduce((s,a)=>s+a.z,0)/q.length})};
const line=(a,b,col,w)=>{const p=pr(a),q=pr(b);push('l',{p,q,col,w,z:(p.z+q.z)/2})};
const ball=(p,r,col)=>{const q=pr(p);push('b',{q,r,col,z:q.z})};
[-36,36].forEach(z=>ring(ell(0,0,62,62,z,36),'rgba('+C.gray+',.08)','rgba('+C.gray+',.55)',1.2));
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,x=Math.cos(a)*62,y=Math.sin(a)*62;line([x,y,-36],[x,y,36],'rgba('+C.gray+',.3)',1)}
[-30,-15,0,15,30].forEach(z=>GM.forEach(g=>ring(ell(g[0],g[1],g[2],g[3],z,16),'rgba('+C.gray+',.16)','rgba('+C.gray+',.35)',0.8)));
ring([[-190,98,20],[-120,98,20],[-120,98,90],[-190,98,90]],'rgba(29,158,117,.16)','rgba(29,158,117,.7)',1.2);
ring([[-190,88,20],[-120,88,20],[-120,88,90],[-190,88,90]],'rgba(29,158,117,.10)','rgba(29,158,117,.5)',1);
[[-190,20],[-120,20],[-120,90],[-190,90]].forEach(a=>line([a[0],98,a[1]],[a[0],88,a[1]],'rgba(29,158,117,.5)',1));
for(let i=0;i<F.length-1;i++){const lit=u>=0&&cum[i+1]<=d;const col=lit?C.act:i<nA?C.aff:i<nA+nI?C.int:C.eff;line(F[i],F[i+1],col,lit?5.5:4)}
dend.forEach(g=>g[3].forEach(o=>line([g[0],g[1],g[2]],[g[0]+o[0],g[1]+o[1],g[2]+o[2]],g[4],1.8)));
ball([-80,100,25],7,C.aff);ball([0,0,0],7,C.int);ball([24,-40,0],7,C.eff);
ball([-155,100,55],6,stage===1?C.act:C.rec);
const mc=[160,-116,-42],a=32*(1-0.25*con),b=14*(1+0.45*con),mcol=stage===5?'239,159,39':'226,75,74';
[-0.7,-0.25,0.25,0.7].forEach(v=>{const r=Math.sqrt(1-v*v),pts=[];for(let i=0;i<14;i++){const g=i/14*Math.PI*2;pts.push([mc[0]+v*a,mc[1]+Math.cos(g)*b*r,mc[2]+Math.sin(g)*b*r])}ring(pts,'rgba('+mcol+',.12)','rgba('+mcol+',.8)',1.2)});
for(let f=0;f<6;f++){const g=f/6*Math.PI*2;let prev=null;for(let j=0;j<=8;j++){const v=-1+j/4,r=Math.sqrt(Math.max(0,1-v*v)),q=[mc[0]+v*a,mc[1]+Math.cos(g)*b*r,mc[2]+Math.sin(g)*b*r];if(prev)line(prev,q,'rgba('+mcol+',.85)',1.4);prev=q}}
it.sort((x,y)=>x.z-y.z);
ctx.lineCap='round';ctx.lineJoin='round';
it.forEach(o=>{
if(o.t==='p'){ctx.beginPath();o.q.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=o.fill;ctx.fill();ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw;ctx.stroke()}
else if(o.t==='l'){ctx.beginPath();ctx.moveTo(o.p.x,o.p.y);ctx.lineTo(o.q.x,o.q.y);ctx.strokeStyle=o.col;ctx.lineWidth=o.w*(o.p.k+o.q.k)/2*S;ctx.stroke()}
else{ctx.beginPath();ctx.arc(o.q.x,o.q.y,o.r*o.q.k*S*1.3,0,7);ctx.fillStyle=o.col;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.stroke()}
});
if(u>=0&&u<1){let i=0;while(i<F.length-2&&cum[i+1]<d)i++;const f=(d-cum[i])/((cum[i+1]-cum[i])||1),p=[0,1,2].map(k=>F[i][k]+(F[i+1][k]-F[i][k])*f),q=pr(p);ctx.beginPath();ctx.arc(q.x,q.y,9*q.k*S,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.act;ctx.stroke()}
ctx.font='500 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
BD.forEach(o=>{const q=pr(o),on=stage===o[4];ctx.beginPath();ctx.arc(q.x,q.y,10,0,7);ctx.fillStyle=on?C.act:o[3];ctx.fill();ctx.fillStyle=on?'#412402':'#fff';ctx.fillText(o[4],q.x,q.y+0.5)});
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
